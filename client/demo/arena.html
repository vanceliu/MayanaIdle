<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>競技場 Demo — MayanaIdle</title>
<!--
  競技場（`55-arena.md`）：NPC 介面（入場／兌換／排行榜）、場內 HUD、背包票券分頁。
  版面樣本：段位、材料、費用、組隊數量依 55；持有數量、排行榜、場內進度為假資料。

  用 Vite dev server 開：`npm run dev` 後開
  http://localhost:5173/MayanaIdle/demo/arena.html
  .demo-* 是這頁的排版；.arena-* 為新增樣式；其餘來自 App.css。
-->
<link rel="stylesheet" href="../src/App.css">
<style>
/* ═══════════ 這頁專用的排版 ═══════════ */
body {
  margin: 0; padding: 24px 16px;
  background: var(--bg-deepest); color: var(--text-primary); font-family: var(--font-body);
}
.demo-title { font-family: var(--font-display); color: var(--accent-primary); margin: 0 0 4px; }
.demo-note { color: var(--text-dim); font-size: var(--fs-sm); margin: 0 0 16px; line-height: 1.8; max-width: 900px; }
.demo-bar { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 16px; font-size: var(--fs-sm); }
.demo-grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.demo-col { display: flex; flex-direction: column; gap: 16px; }
.demo-card {
  background: var(--bg-panel); border: var(--border-width) solid var(--outline-dark);
  border-radius: var(--radius-md); padding: 12px;
}
.demo-card h2 { font-family: var(--font-display); font-size: var(--fs-md); color: var(--accent-gold); margin: 0 0 8px; }
/* 寬度＝遊戲裡城鎮設施視窗（`.town-modal` 600px） */
.demo-npc { width: min(600px, 100%); height: 700px; display: flex; flex-direction: column; box-sizing: border-box; }
.demo-npc .guild-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.demo-hud { width: 300px; box-sizing: border-box; }
/* 寬度＝遊戲背包視窗（`PANEL_WIDTHS.bag` 420px） */
.demo-bag { width: 420px; box-sizing: border-box; }
.demo-row-inline { display: flex; gap: 8px; margin-top: 8px; }
.arena-demo-reset { margin-top: 8px; align-self: flex-start; }

/* ═══════════ 新增樣式（之後搬進 App.css） ═══════════ */
.arena-tier-closed { opacity: 0.5; }
.arena-closed-tag {
  margin-left: 8px; padding: 0 6px; font-size: var(--fs-xs);
  border: var(--border-width) solid var(--outline-dark); border-radius: var(--radius-sm); color: var(--text-dim);
}
.arena-wave-note { font-size: var(--fs-sm); color: var(--text-dim); line-height: 1.7; margin: 6px 0; }
.arena-rank-filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.arena-rank-filters button.active { border-color: var(--accent-primary); background: var(--accent-primary); color: var(--bg-deepest); }
.arena-rank-sep { width: 12px; }
.arena-rank-table { width: 100%; margin-top: 8px; }
.arena-hud { display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-sm); }
.arena-hud-title { font-family: var(--font-display); color: var(--accent-primary); }
.arena-hud-row { display: flex; justify-content: space-between; }
.arena-hud-boss { color: var(--accent-gold); }
</style>
</head>
<body>
  <h1 class="demo-title">競技場</h1>
  <p class="demo-note">
    左邊是城鎮的競技場 NPC（入場／兌換；排行榜放統計中心），右邊是入場後的場內 HUD，以及遊戲本身的背包面板（票券抽屜在印記按鈕旁）。<br>
    T5 預設為「本時段已用掉票券場」；角色等級拉桿看等級門檻（T4 Lv.38／T5 Lv.50／T6 Lv.60），組隊時第 2 位隊員設定為比你低 6 級；「模擬到達重置時刻」恢復次數。用下方拉桿看金幣不足與組隊人數的差異。<br>
    T7 顯示但未開放；兌換分頁列出 T4～T6 的武器／防具／飾品兌換箱（票券 10／6／6 張），開箱結果見 arena-box.html。
  </p>
  <div class="demo-bar">
    <label>持有金幣 <input id="gold" type="range" min="0" max="1000000" step="10000" value="600000"></label>
    <span id="gold-label"></span>
    <label>隊伍人數 <input id="members" type="range" min="1" max="4" step="1" value="1"></label>
    <label>角色等級 <input id="level" type="range" min="30" max="80" step="1" value="55"></label>
  </div>
  <div id="root"></div>
  <script type="module" src="./arenaDemo.tsx"></script>
</body>
</html>
