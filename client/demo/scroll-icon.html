<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>強化卷軸圖示 — MayanaIdle</title>
<!--
  六種強化卷軸的圖示對照（`34-ui-guidelines.md` § 34.13）。

  用 Vite dev server 開：`npm run dev` 後開
  http://localhost:5173/MayanaIdle/demo/scroll-icon.html

  描邊樣式**已定案並寫進 App.css**（`.item-icon-glow`）：
  E 描邊＋貼邊微光、stroke-width 40、＋ 金 #FACC15、－ 紅 #FF0000。
  本頁吃 App.css 的正式 class，看到的就是遊戲裡的樣子；
  上方滑桿只是**臨時覆寫**，用來再確認數值，改動不會回寫 App.css。
-->
<link rel="stylesheet" href="../src/App.css">
<style>
/* ═══════════ 這頁專用的排版（不會進 App.css） ═══════════ */
body { margin: 0; padding: 24px; background: var(--bg-deepest); color: var(--text-primary); font-family: var(--font-body); }
.demo-title { font-family: var(--font-display); color: var(--accent-primary); margin: 0 0 4px; }
.demo-note { color: var(--text-dim); font-size: var(--fs-sm); margin: 0 0 20px; line-height: 1.8; max-width: 72ch; }
.demo-note code { color: var(--text-secondary); }

.demo-bar {
  display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center;
  background: var(--bg-panel); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 24px;
  position: sticky; top: 0; z-index: 10;
}
.demo-bar label { font-size: var(--fs-sm); color: var(--text-secondary); display: flex; gap: 8px; align-items: center; }
.demo-bar input[type="range"] { width: 130px; }
.demo-bar output { color: var(--text-primary); min-width: 3.2em; font-variant-numeric: tabular-nums; }
.demo-bar button {
  padding: 6px 14px; background: var(--bg-card); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: var(--fs-sm);
}

.demo-section { margin-bottom: 32px; }
.demo-section h2 {
  font-family: var(--font-display); font-size: var(--fs-md); color: var(--text-secondary);
  margin: 0 0 4px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 6px;
}
.demo-section p.hint { color: var(--text-dim); font-size: var(--fs-sm); margin: 6px 0 14px; }

.demo-row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-end; }
.demo-cell-label { font-size: var(--fs-sm); color: var(--text-dim); text-align: center; margin-top: 6px; }
.demo-grid {
  display: grid; grid-auto-rows: 72px; gap: 6px;
  background: var(--bg-panel); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); padding: 10px; width: max-content;
}
.demo-shoplist { max-width: 440px; display: flex; flex-direction: column; gap: 8px; }
.demo-out {
  background: var(--bg-inset); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
  padding: 12px 14px; font-family: var(--font-mono, ui-monospace, monospace); font-size: 12.5px;
  color: var(--text-secondary); white-space: pre; overflow-x: auto;
}

/* 臨時覆寫：只在這頁生效，用來再確認描邊粗細與顏色 */
body[data-override="on"] .item-icon-glow svg path { stroke-width: var(--stroke-w); }
body[data-override="on"] .item-icon-glow--gold { --icon-glow: var(--gold); }
body[data-override="on"] .item-icon-glow--red { --icon-glow: var(--red); }
</style>
</head>
<body data-override="on" style="--stroke-w: 40; --gold: #FACC15; --red: #FF0000;">

<h1 class="demo-title">強化卷軸圖示</h1>
<p class="demo-note">
  六種卷軸共用同一支圖示：<strong>用途看填色</strong>（武器＝粉、防具＝藍），
  <strong>階別看描邊</strong>（普通無描邊、＋金色、－紅色）。
  描邊已寫進 <code>App.css</code> 的 <code>.item-icon-glow</code>，本頁吃的就是正式 class；
  滑桿只是臨時覆寫，用來再確認數值。
</p>

<div class="demo-bar">
  <label>＋ 描邊色 <input id="c-gold" type="color" autocomplete="off" value="#FACC15"></label>
  <label>－ 描邊色 <input id="c-red" type="color" autocomplete="off" value="#FF0000"></label>
  <label>描邊粗細 <input id="c-stroke" type="range" autocomplete="off" min="0" max="60" step="2" value="40"><output id="o-stroke">40</output></label>
  <button id="btn-css" type="button">產生 CSS</button>
</div>

<section class="demo-section">
  <h2>背包格子（.bag-cell）</h2>
  <p class="hint">六種同時擺進背包，一眼分得出誰是誰才算過關。最右邊的混沌印記是沒有描邊的對照組。</p>
  <div class="demo-grid" id="grid" style="grid-template-columns: repeat(7, 72px);"></div>
</section>

<section class="demo-section">
  <h2>鐵匠鋪／雜貨店清單列（.shop-item）</h2>
  <p class="hint">列表模式圖示只有 24px，描邊在這個尺寸還看不看得見。</p>
  <div class="demo-shoplist" id="shoplist"></div>
</section>

<section class="demo-section">
  <h2>放大對照（96px）</h2>
  <p class="hint">看描邊是否貼著輪廓，以及貼邊微光有沒有糊掉形狀。</p>
  <div class="demo-row" id="big"></div>
</section>

<section class="demo-section">
  <h2>目前的 CSS</h2>
  <div class="demo-out" id="out">按上面的「產生 CSS」</div>
</section>

<script type="module">
const SCROLL = await fetch('../src/assets/icons/items/scroll-unfurled.svg').then(r => r.text());

const WEAPON = '#F472B6';
const ARMOR = '#60A5FA';
const GOLD = 'item-icon-glow item-icon-glow--gold';
const RED = 'item-icon-glow item-icon-glow--red';

/** 六種卷軸，順序與 itemSeeds 的 id 7／8／157／158／159／160 對應 */
const SCROLLS = [
  ['武器強化卷軸', WEAPON, '', '武器強化等級 +1'],
  ['防具強化卷軸', ARMOR, '', '防具強化等級 +1'],
  ['武器強化卷軸＋', WEAPON, GOLD, '武器強化等級隨機 +1~3'],
  ['防具強化卷軸＋', ARMOR, GOLD, '防具強化等級隨機 +1~3'],
  ['武器強化卷軸－', WEAPON, RED, '武器強化等級 -1，必定成功'],
  ['防具強化卷軸－', ARMOR, RED, '防具強化等級 -1，必定成功'],
];

function icon(color, size, glowClass) {
  const span = document.createElement('span');
  span.className = `game-icon ${glowClass}`;
  span.style.cssText = `width:${size}px;height:${size}px;color:${color}`;
  span.innerHTML = SCROLL;
  return span;
}

function bagCell(name, color, glowClass, count) {
  const cell = document.createElement('div');
  cell.className = 'bag-cell';
  const n = document.createElement('span');
  n.className = 'bag-cell-name';
  n.textContent = name;
  const c = document.createElement('span');
  c.className = 'bag-cell-count';
  c.textContent = `×${count}`;
  cell.append(icon(color, 24, glowClass), n, c);
  return cell;
}

function shopRow(name, color, glowClass, desc) {
  const row = document.createElement('div');
  row.className = 'shop-item';
  const info = document.createElement('div');
  info.className = 'shop-item-info';
  const title = document.createElement('span');
  title.className = 'shop-item-name';
  title.append(icon(color, 24, glowClass), document.createTextNode(' ' + name));
  const d = document.createElement('span');
  d.className = 'shop-item-desc';
  d.textContent = desc;
  info.append(title, d);
  row.append(info);
  return row;
}

const grid = document.getElementById('grid');
const shoplist = document.getElementById('shoplist');
const big = document.getElementById('big');

SCROLLS.forEach(([name, color, glow, desc], i) => {
  grid.append(bagCell(name, color, glow, 3 + i * 4));
  shoplist.append(shopRow(name, color, glow, desc));
  const box = document.createElement('div');
  const holder = document.createElement('div');
  holder.append(icon(color, 96, glow));
  const cap = document.createElement('div');
  cap.className = 'demo-cell-label';
  cap.textContent = name;
  box.append(holder, cap);
  big.append(box);
});
grid.append(bagCell('混沌印記', '#A855F7', '', 22));

const root = document.body;
const strokeInput = document.getElementById('c-stroke');
const strokeOut = document.getElementById('o-stroke');
strokeInput.addEventListener('input', () => {
  strokeOut.textContent = strokeInput.value;
  root.style.setProperty('--stroke-w', strokeInput.value);
});
document.getElementById('c-gold').addEventListener('input', e => root.style.setProperty('--gold', e.target.value));
document.getElementById('c-red').addEventListener('input', e => root.style.setProperty('--red', e.target.value));

document.getElementById('btn-css').addEventListener('click', () => {
  const gold = document.getElementById('c-gold').value;
  const red = document.getElementById('c-red').value;
  const stroke = strokeInput.value;
  document.getElementById('out').textContent =
`/* 特殊卷軸的圖示描邊＋貼邊微光（34-ui-guidelines.md § 34.13） */
.item-icon-glow svg path {
  stroke: var(--icon-glow);
  stroke-width: ${stroke};   /* SVG viewBox 512 的座標，不是螢幕 px */
  stroke-linejoin: round;
  paint-order: stroke fill;
}

.item-icon-glow {
  filter: drop-shadow(0 0 7px color-mix(in srgb, var(--icon-glow) 75%, transparent));
}

.item-icon-glow--gold { --icon-glow: ${gold}; }
.item-icon-glow--red { --icon-glow: ${red}; }`;
});
</script>
</body>
</html>
