<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>裝備欄詞綴加總 Demo — MayanaIdle</title>
<!--
  裝備欄詞綴加總（`34-ui-guidelines.md`）。掛的是正式的 `EquipmentPanel`，只換成假裝備。

  用 Vite dev server 開：`npm run dev` 後開
  http://localhost:5173/MayanaIdle/demo/equip-affix-summary.html

  .demo-* 只是這頁的排版；其餘樣式來自 App.css。
-->
<link rel="stylesheet" href="../src/App.css">
<style>
/* ═══════════ 這頁專用的排版 ═══════════ */
body {
  margin: 0; padding: 24px;
  background: var(--bg-deepest); color: var(--text-primary); font-family: var(--font-body);
}
.demo-title { font-family: var(--font-display); color: var(--accent-primary); margin: 0 0 4px; }
.demo-note { color: var(--text-dim); font-size: var(--fs-sm); margin: 0 0 16px; line-height: 1.8; }
.demo-bar {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  background: var(--bg-panel); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); padding: 10px 14px; margin-bottom: 20px; font-size: var(--fs-sm);
}
.demo-bar button {
  padding: 6px 14px; background: var(--bg-card); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: var(--fs-sm);
}
.demo-grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
/* 寬度 ≈ 遊戲裡裝備欄浮動視窗 */
.demo-card {
  width: 340px; background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 12px;
}
.demo-card h2 { font-family: var(--font-display); font-size: var(--fs-md); color: var(--accent-gold); margin: 0 0 4px; }
.demo-card > p { color: var(--text-dim); font-size: var(--fs-xs); margin: 0 0 10px; line-height: 1.6; }

</style>
</head>
<body>
  <h1 class="demo-title">裝備欄：詞綴加總</h1>
  <p class="demo-note">
    上半部是正式的裝備欄（滑過格子看每件的詞綴）。下方的加總只算生效中的詞綴：素質不足凍結的件不計、同類 T7 獨有詞綴只算一件。<br>
    百分比詞綴帶一位小數；最大 HP、回血、迴避值是固定值。按「重抽裝備」換一組隨機詞綴。
  </p>
  <div class="demo-bar">
    <button type="button" id="reroll">重抽裝備</button>
    <button type="button" id="empty">清空裝備</button>
  </div>
  <div id="root"></div>
  <script type="module" src="./equipAffixSummaryDemo.tsx"></script>
</body>
</html>
