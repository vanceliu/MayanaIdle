<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>隨機技能 Demo — MayanaIdle</title>
<!--
  隨機技能（`07-affix-ability.md`）：鐵匠鋪製作武器時指定技能、裝備 tooltip 的技能行。
  版面樣本：class 與 App.css 相同，資料取自 seed 與 `models/ability.ts`。

  用 Vite dev server 開：`npm run dev` 後開
  http://localhost:5173/MayanaIdle/demo/ability.html
-->
<link rel="stylesheet" href="../src/App.css">
<style>
body {
  margin: 0; padding: 24px;
  background: var(--bg-deepest); color: var(--text-primary); font-family: var(--font-body);
}
.demo-title { font-family: var(--font-display); color: var(--accent-primary); margin: 0 0 4px; }
.demo-note { color: var(--text-dim); font-size: var(--fs-sm); margin: 0 0 16px; line-height: 1.8; }
.demo-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; font-size: var(--fs-sm); }
.demo-grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.demo-card {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 12px;
}
.demo-card h2 { font-family: var(--font-display); font-size: var(--fs-md); color: var(--accent-gold); margin: 0 0 8px; }
.demo-blacksmith { width: 600px; max-width: 100%; }
.demo-tooltip { width: 320px; }

/* 提案：隨機技能（§ 7S.7）淺綠、排在所有詞綴最上面 */
.equip-detail-ability { padding-bottom: 4px; }
.equip-detail-affix.ability { color: #86EFAC; text-shadow: 0 0 6px rgba(134,239,172,0.3); font-weight: 700; }
.equip-detail-ability + .equip-detail-unique { padding-top: 0; }

/* 提案：鐵匠鋪的技能選擇列 */
.bs-ability-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.bs-ability-row select {
  background: var(--bg-deepest); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px 4px; font-size: var(--fs-sm);
}
.bs-ability-row .bs-ability-preview { color: #86EFAC; }
.bs-ability-row.lacking .bs-ability-label { color: var(--accent-danger); }

/* 提案：技能 tooltip 被隨機技能改動的數字（只標數字） */
.stat-changed { color: #FACC15; font-weight: 700; }
.demo-skill-tooltip { position: static; display: block; width: 240px; }
.demo-skill-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; font-size: var(--fs-sm); }

/* 提案：裝備欄詞綴加總的隨機技能列（排在最後、淺綠、只列效果） */
.affix-sum-row.ability span { color: #86EFAC; }
.demo-summary { width: 360px; }
.demo-wiki { width: 640px; max-width: 100%; }
</style>
</head>
<body>
  <h1 class="demo-title">隨機技能</h1>
  <p class="demo-note">
    鐵匠鋪製作武器時必須指定一種隨機技能（共通池＋製作角色的職業池），數值取最弱值；未指定時製作鈕停用。<br>
    tooltip 的技能行放在所有詞綴最上面，淺綠色，不加前綴。切換職業看職業池變化；限定騎士的武器換成其他職業時只剩共通池。
  </p>
  <p class="demo-note">技能 tooltip：被職業池隨機技能改動的數字以黃色顯示，其餘文字不變色。</p>
  <p class="demo-note">裝備欄詞綴加總：隨機技能排在最後，淺綠色、只列效果。Wiki：詞綴頁與武器頁加〈隨機技能〉節（取得規則＋共通池＋五職業池）。</p>
  <div id="root"></div>
  <script type="module" src="./abilityDemo.tsx"></script>
</body>
</html>
