<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鐵匠鋪製作費 Demo — MayanaIdle</title>
<!--
  鐵匠鋪製作收金幣（`06-equipment-acquire.md` § 6A.3）：配方卡片與製作追蹤的「金幣」需求行。
  版面樣本：class 與 App.css 相同，資料取自 seed。

  用 Vite dev server 開：`npm run dev` 後開
  http://localhost:5173/MayanaIdle/demo/craft-gold.html
-->
<link rel="stylesheet" href="../src/App.css">
<style>
body {
  margin: 0; padding: 24px;
  background: var(--bg-deepest); color: var(--text-primary); font-family: var(--font-body);
}
.demo-title { font-family: var(--font-display); color: var(--accent-primary); margin: 0 0 4px; }
.demo-note { color: var(--text-dim); font-size: var(--fs-sm); margin: 0 0 16px; line-height: 1.8; }
.demo-bar {
  display: flex; gap: 12px; align-items: center; margin-bottom: 16px; font-size: var(--fs-sm);
}
.demo-grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.demo-card {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 12px;
}
.demo-card h2 { font-family: var(--font-display); font-size: var(--fs-md); color: var(--accent-gold); margin: 0 0 8px; }
.demo-blacksmith { width: 600px; }
.demo-tracker { width: 300px; }
</style>
</head>
<body>
  <h1 class="demo-title">鐵匠鋪製作費</h1>
  <p class="demo-note">
    製作費：T4 20,000G／T5 50,000G／T6 80,000G。金幣與素材、前置裝備並列為一項需求，不足時標紅，製作鈕停用。<br>
    拉桿調整持有金幣，看三種階級的足／不足。
  </p>
  <div class="demo-bar">
    <label>持有金幣 <input id="gold" type="range" min="0" max="120000" step="1000" value="30000"></label>
    <span id="gold-label"></span>
  </div>
  <div id="root"></div>
  <script type="module" src="./craftGoldDemo.tsx"></script>
</body>
</html>
