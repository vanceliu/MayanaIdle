<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>印記師詞綴列 Tier 區間 Demo — MayanaIdle</title>
<!--
  印記師詞綴列顯示該 Tier 數值上下限的四種版面（不接遊戲邏輯）。
  數值與區間直接讀 `src/models/affix.ts`（`07-affix.md` § 7.3／§ 7.3.1）。

  用 Vite dev server 開：`npm run dev` 後開
  http://localhost:5173/MayanaIdle/demo/sigil-tier-range.html

  .demo-* 只是這頁的排版；.sigil-range-* 是定案後要搬進 App.css 的部分。
-->
<link rel="stylesheet" href="../src/App.css">
<style>
/* ═══════════ 這頁專用的排版（不會進 App.css） ═══════════ */
body {
  margin: 0;
  padding: 24px;
  background: var(--bg-deepest);
  color: var(--text-primary);
  font-family: var(--font-body);
}
.demo-title { font-family: var(--font-display); color: var(--accent-primary); margin: 0 0 4px; }
.demo-note { color: var(--text-dim); font-size: var(--fs-sm); margin: 0 0 16px; line-height: 1.8; }
.demo-bar {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  background: var(--bg-panel); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); padding: 10px 14px; margin-bottom: 20px;
}
.demo-bar button {
  padding: 6px 14px; background: var(--bg-card); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer;
  font-size: var(--fs-sm);
}
.demo-bar button.active { border-color: var(--accent-gold); color: var(--accent-gold); }
.demo-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px;
}
.demo-grid.mobile { grid-template-columns: 393px; }
.demo-card {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 12px 14px;
}
.demo-card h2 {
  font-family: var(--font-display); font-size: var(--fs-md); color: var(--accent-gold); margin: 0 0 4px;
}
.demo-card p { color: var(--text-dim); font-size: var(--fs-xs); margin: 0 0 10px; line-height: 1.6; }

/* ═══════════ 候選 CSS（定案的那一種搬進 App.css） ═══════════ */

/* A：數值後接區間，同一列淡色 */
.sigil-range-inline {
  flex: 0 0 auto;
  font-size: var(--fs-xs);
  color: var(--text-dim);
  font-family: var(--font-mono);
}

/* B：數值下方第二行 */
.sigil-range-stack { display: flex; flex-direction: column; line-height: 1.25; }
.sigil-range-stack .sigil-range-sub {
  font-size: calc(var(--fs-xs) * 0.9);
  color: var(--text-dim);
  font-family: var(--font-mono);
}

/* C：位置條，標出數值落在區間的哪裡 */
.sigil-range-bar {
  display: flex; align-items: center; gap: 6px;
  flex: 1; min-width: 0;
  font-size: calc(var(--fs-xs) * 0.9);
  color: var(--text-dim);
  font-family: var(--font-mono);
}
.sigil-range-track {
  position: relative; flex: 1; min-width: 40px; height: 4px;
  background: var(--bg-deepest); border-radius: 2px;
}
.sigil-range-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  border-radius: 2px; background: currentColor; opacity: 0.6;
}
</style>
</head>
<body>
  <h1 class="demo-title">印記師詞綴列：Tier 數值上下限</h1>
  <p class="demo-note">
    同一組詞綴用四種方式顯示該 Tier 的區間。數值是原始值（印記師不吃品質，同現行）。<br>
    滑過詞綴列可看 tooltip。無 Tier 的額外屬性與特殊詞綴不顯示區間。
  </p>
  <div class="demo-bar">
    <span>寬度：</span>
    <button type="button" data-width="desktop" class="active">桌機</button>
    <button type="button" data-width="mobile">手機 393px</button>
  </div>
  <div class="demo-grid" id="grid"></div>
  <script type="module" src="./sigilTierRangeDemo.ts"></script>
</body>
</html>
