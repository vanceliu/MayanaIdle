<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>印記師詞綴列 Tier 區間 Demo — MayanaIdle</title>
<!--
  印記師詞綴列定案版（`13-town.md` § 13.13.1，不接遊戲邏輯）：位置條＋原因在 tooltip。
  數值與區間直接讀 `src/models/affix.ts`（`07-affix.md` § 7.3／§ 7.3.1）。

  用 Vite dev server 開：`npm run dev` 後開
  http://localhost:5173/MayanaIdle/demo/sigil-tier-range.html

  .demo-* 只是這頁的排版；詞綴列樣式直接用 App.css。
-->
<link rel="stylesheet" href="../src/App.css">
<style>
/* ═══════════ 這頁專用的排版（不會進 App.css） ═══════════ */
body {
  margin: 0;
  padding: 24px;
  background: var(--bg-deepest);
  color: var(--text-primary);
  font-family: var(--font-body);
}
.demo-title { font-family: var(--font-display); color: var(--accent-primary); margin: 0 0 4px; }
.demo-note { color: var(--text-dim); font-size: var(--fs-sm); margin: 0 0 16px; line-height: 1.8; }
.demo-bar {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  background: var(--bg-panel); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); padding: 10px 14px; margin-bottom: 20px;
}
.demo-bar button {
  padding: 6px 14px; background: var(--bg-card); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer;
  font-size: var(--fs-sm);
}
.demo-bar button.active { border-color: var(--accent-gold); color: var(--accent-gold); }
.demo-grid {
  /* 每張卡的詞綴區寬度 ≈ 實際印記師右欄（約 290px） */
  display: grid; grid-template-columns: repeat(auto-fill, 320px); gap: 16px;
}
.demo-grid.mobile { grid-template-columns: 393px; }
.demo-card {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 12px 14px;
}
.demo-card h2 {
  font-family: var(--font-display); font-size: var(--fs-md); color: var(--accent-gold); margin: 0 0 4px;
}
.demo-card p { color: var(--text-dim); font-size: var(--fs-xs); margin: 0 0 10px; line-height: 1.6; }
.demo-sample-title { font-size: var(--fs-xs); color: var(--text-secondary); margin: 12px 0 6px; font-weight: 400; }

</style>
</head>
<body>
  <h1 class="demo-title">印記師詞綴列：Tier 區間位置條</h1>
  <p class="demo-note">
    定案版：標籤＋數值＋位置條；不能選的原因放在整列 tooltip（滑過可看）。卡片寬度約等於實際印記師右欄。<br>
    重現實際畫面（盜賊皮衣、風鳴弓，選精鍊印記）。數值是原始值（印記師不吃品質）；額外屬性無 Tier，不顯示位置條。
  </p>
  <div class="demo-bar">
    <span>寬度：</span>
    <button type="button" data-width="desktop" class="active">桌機</button>
    <button type="button" data-width="mobile">手機 393px</button>
  </div>
  <div class="demo-grid" id="grid"></div>
  <script type="module" src="./sigilTierRangeDemo.ts"></script>
</body>
</html>
