<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>獨特製作 Demo — MayanaIdle</title>
<!--
  鐵匠鋪「獨特製作」分頁（`06-equipment-acquire.md` § 6A.3.1、§ 6A.6「製作品 (獨)」、§ 6A.3「拆解」；
  `07-affix-ability.md` § 7S.2）：配方卡片、前置裝備挑選、產物 tooltip、(獨) 的拆解列、任務追蹤。
  版面樣本：class 與 App.css 相同；模板、一般配方、製作費取自 seed，獨特配方在 seed 有 `uniqueCraftMaterials` 時用 seed，
  否則依「獨特配方分配規則」產生假配方；持有量與前置裝備實例為假資料。

  用 Vite dev server 開：`npm run dev` 後開
  http://localhost:5173/MayanaIdle/demo/unique-craft.html
  .demo-* 是這頁的排版，其餘來自 App.css。
-->
<link rel="stylesheet" href="../src/App.css">
<style>
/* ═══════════ 這頁專用的排版 ═══════════ */
body {
  margin: 0; padding: 24px;
  background: var(--bg-deepest); color: var(--text-primary); font-family: var(--font-body);
}
.demo-title { font-family: var(--font-display); color: var(--accent-primary); margin: 0 0 4px; }
.demo-note { color: var(--text-dim); font-size: var(--fs-sm); margin: 0 0 16px; line-height: 1.8; max-width: 1100px; }
.demo-bar { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin-bottom: 16px; font-size: var(--fs-sm); }
.demo-bar fieldset { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 10px; margin: 0; }
.demo-bar legend { color: var(--accent-gold); padding: 0 4px; }
.demo-bar label { margin-right: 10px; cursor: pointer; }
.demo-grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.demo-col { display: flex; flex-direction: column; gap: 16px; }
.demo-card {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 12px; box-sizing: border-box;
}
.demo-card h2 { font-family: var(--font-display); font-size: var(--fs-md); color: var(--accent-gold); margin: 0 0 8px; }
/* 寬度＝遊戲裡城鎮設施視窗（`.town-modal` 600px） */
.demo-blacksmith { width: min(600px, 100%); height: 760px; display: flex; flex-direction: column; }
.demo-blacksmith .blacksmith-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.demo-preview { width: 320px; max-width: 100%; }
.demo-tracker { width: 320px; max-width: 100%; }
.demo-stock { font-size: var(--fs-xs); color: var(--text-secondary); line-height: 1.8; }
.demo-tooltip { background: var(--bg-deepest); border: var(--border-width) solid var(--outline-dark); border-radius: var(--radius-sm); padding: 8px; }
.demo-placeholder { color: var(--text-dim); padding: 16px 0; }
</style>
</head>
<body>
  <h1 class="demo-title">獨特製作</h1>
  <p class="demo-note">
    鐵匠鋪新分頁「獨特製作」，放在「裝備製作」之後。配方同一般製作（有 <code>craftMaterials</code> 的 T4～T6），前置裝備改為<strong>同一模板 ×1</strong>：
    掉落品、商店品、(鍛) 可用，(獨)、(擬) 不可（灰掉註明）；材料改為獨特材料／Boss 專屬素材；製作費同一般製作；不指定隨機技能。<br>
    點配方卡片選定，右邊顯示產物 (獨) 的 tooltip（遊戲的 <code>EquipmentDetail</code>，詞綴與技能依 § 6A.6 隨機抽，可重抽）。
    「裝備拆解」分頁看 (獨) 的拆解列：退一般配方 100%、獨特材料不退、不留技能結晶。
  </p>
  <div id="root"></div>
  <script type="module" src="./uniqueCraftDemo.tsx"></script>
</body>
</html>
