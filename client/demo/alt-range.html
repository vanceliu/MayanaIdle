<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>裝備 tooltip Alt 區間 Demo — MayanaIdle</title>
<!--
  裝備 tooltip 按住 Alt 顯示數值區間（`34-ui-guidelines.md` § 34.2）。

  用 Vite dev server 開：`npm run dev` 後開
  http://localhost:5173/MayanaIdle/demo/alt-range.html

  .demo-* 只是這頁的排版；其餘樣式來自 App.css。
-->
<link rel="stylesheet" href="../src/App.css">
<style>
/* ═══════════ 這頁專用的排版 ═══════════ */
body {
  margin: 0; padding: 24px;
  background: var(--bg-deepest); color: var(--text-primary); font-family: var(--font-body);
}
.demo-title { font-family: var(--font-display); color: var(--accent-primary); margin: 0 0 4px; }
.demo-note { color: var(--text-dim); font-size: var(--fs-sm); margin: 0 0 16px; line-height: 1.8; }
.demo-state { display: inline-block; padding: 2px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
.demo-state.on { color: #FACC15; border-color: #FACC15; }
.demo-grid { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.demo-col h2 { font-family: var(--font-display); font-size: var(--fs-md); color: var(--accent-gold); margin: 0 0 8px; }
.demo-col .bag-tooltip { position: static; pointer-events: auto; margin-bottom: 16px; }
</style>
</head>
<body>
  <h1 class="demo-title">裝備 tooltip：按住 Alt 顯示數值區間</h1>
  <p class="demo-note">
    左欄是現在的樣子，中欄是按住 Alt 的樣子，右欄跟著鍵盤變（按住 Alt／Option 試試）。<br>
    詞綴區間 = 同 Tier 的最小～最大值乘品質；隨機技能區間依該件模板（追加傷害上限 = 武器值）。<br>
    特殊詞綴、額外屬性沒有區間。
  </p>
  <p class="demo-note">目前：<span id="state" class="demo-state">未按 Alt</span></p>
  <div id="root"></div>
  <script type="module" src="./altRangeDemo.tsx"></script>
</body>
</html>
