<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自動拆解含 (獨) Demo — MayanaIdle</title>
<!--
  補給天賦「拆解裝備」參數（`49-village-script.md` § 49.4.1）：在「含製作品 (鍛)」下方新增「含製作品 (獨)」，預設關。
  版面樣本：天賦格列的 class 與 App.css 相同；欄位取自 `models/talentParams.ts` 的 `dismantle_equipment`，
  改後版本在 (鍛) 之後插入新欄位；多選欄位用遊戲的 `TalentMultiParam`。

  用 Vite dev server 開：`npm run dev` 後開
  http://localhost:5173/MayanaIdle/demo/auto-disassemble-unique.html
  .demo-* 是這頁的排版；其餘來自 App.css（新欄位沿用 `.talent-param`，不需新樣式）。
-->
<link rel="stylesheet" href="../src/App.css">
<style>
/* ═══════════ 這頁專用的排版 ═══════════ */
body {
  margin: 0; padding: 24px;
  background: var(--bg-deepest); color: var(--text-primary); font-family: var(--font-body);
}
.demo-title { font-family: var(--font-display); color: var(--accent-primary); margin: 0 0 4px; }
.demo-note { color: var(--text-dim); font-size: var(--fs-sm); margin: 0 0 16px; line-height: 1.8; max-width: 1000px; }
.demo-grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.demo-card {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 12px; box-sizing: border-box;
}
.demo-card h2 { font-family: var(--font-display); font-size: var(--fs-md); color: var(--accent-gold); margin: 0 0 8px; }
/* 寬度＝遊戲裡天賦視窗（`PANEL_WIDTHS.script` 480px） */
.demo-editor { width: min(480px, 100%); }
.demo-editor.is-before { opacity: 0.8; }
.demo-new-field { outline: 1px dashed var(--accent-gold); outline-offset: 2px; border-radius: var(--radius-sm); }
.demo-params { font-size: var(--fs-xs); color: var(--text-secondary); margin-top: 8px; line-height: 1.7; word-break: break-all; }
</style>
</head>
<body>
  <h1 class="demo-title">自動拆解含 (獨)</h1>
  <p class="demo-note">
    補給分頁的「拆解裝備」動作：「含製作品 (鍛)」下方新增「含製作品 (獨)」，<strong>預設關</strong>，開啟才拆 (獨) 製作品。<br>
    (獨) 拆解規則同手動拆解（退一般配方 100%、獨特材料不退、不留技能結晶，`06-equipment-acquire.md` § 6A.3「拆解」）。<br>
    畫面是改後的版本（勾「顯示現行版本對照」才會多出改版前的介面）；改後的新欄位以虛線框標出（框只是 demo 標示）。勾選、改數字都能操作，下方顯示寫入的參數。
  </p>
  <div id="root"></div>
  <script type="module" src="./autoDisassembleUniqueDemo.tsx"></script>
</body>
</html>
