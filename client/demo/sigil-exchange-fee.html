<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>印記兌換手續費輸入 Demo — MayanaIdle</title>
<!--
  印記兌換「手續費」輸入方式比較（`13-town.md` § 13.13.2、`46-sigil.md` § 46.13，不接遊戲邏輯）。
  手續費兩種印記各佔一整行，多出的寬度放快速按鈕；材料區維持兩欄。

  用 Vite dev server 開：`npm run dev` 後開
  http://localhost:5173/MayanaIdle/demo/sigil-exchange-fee.html

  .demo-* 只是這頁的排版與候選樣式；其餘直接用 App.css 的 `.sigil-*`。
-->
<link rel="stylesheet" href="../src/App.css">
<style>
/* ═══════════ 這頁專用的排版 ═══════════ */
body {
  margin: 0;
  padding: 24px;
  background: var(--bg-deepest);
  color: var(--text-primary);
  font-family: var(--font-body);
}
.demo-title { font-family: var(--font-display); color: var(--accent-primary); margin: 0 0 4px; }
.demo-note { color: var(--text-dim); font-size: var(--fs-sm); margin: 0 0 16px; line-height: 1.8; }
.demo-bar {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  background: var(--bg-panel); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); padding: 10px 14px; margin-bottom: 20px;
  font-size: var(--fs-sm);
}
.demo-bar button {
  padding: 6px 14px; background: var(--bg-card); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer;
  font-size: var(--fs-sm);
}
.demo-bar button.active { border-color: var(--accent-gold); color: var(--accent-gold); }
.demo-bar label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.demo-bar input[type='number'] {
  width: 64px; background: var(--bg-inset); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 6px;
}
.demo-grid { display: grid; grid-template-columns: repeat(auto-fill, 560px); gap: 16px; }
.demo-grid.mobile { grid-template-columns: 393px; }
.demo-card {
  display: flex; flex-direction: column; gap: 8px;
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 12px 14px;
}
.demo-card h2 { font-family: var(--font-display); font-size: var(--fs-md); color: var(--accent-gold); margin: 0; }
.demo-card > p.demo-desc { color: var(--text-dim); font-size: var(--fs-xs); margin: 0; line-height: 1.6; }
.demo-msg { font-size: var(--fs-sm); color: var(--text-secondary); min-height: 1.5em; }
.demo-msg.is-error { color: var(--accent-danger); }

/* ═══════════ 候選樣式（定案後搬進 App.css） ═══════════ */
/* 手續費：每種一整行 */
.demo-fee-rows { display: flex; flex-direction: column; gap: 6px; }
/* 快速按鈕比 −／＋ 寬，放得下兩位數與文字 */
.sigil-exchange-row button.demo-wide { width: auto; min-width: 36px; padding: 0 6px; font-size: var(--fs-xs); }
</style>
</head>
<body>
  <h1 class="demo-title">印記兌換：手續費輸入</h1>
  <p class="demo-note">
    定案方案三：手續費兩種印記各佔一整行，按鈕為 −10／−／＋／＋10／填滿；材料區維持兩欄、不變。可以實際點，滑過按鈕看 tooltip。<br>
    「填滿」＝用這一種補到合計 50（受持有數限制）。勾「預設自動填滿」時，開啟與每次兌換後先填精鍊、不足再填工藝。
  </p>
  <div class="demo-bar">
    <span>寬度：</span>
    <button type="button" data-width="desktop" class="active">桌機</button>
    <button type="button" data-width="mobile">手機 393px</button>
    <label><input type="checkbox" id="autofill" checked> 預設自動填滿</label>
    <label>持有精鍊 <input type="number" id="held-temper" value="1104" min="0"></label>
    <label>持有工藝 <input type="number" id="held-polish" value="1092" min="0"></label>
  </div>
  <div class="demo-grid" id="grid"></div>
  <script type="module" src="./sigilExchangeFeeDemo.ts"></script>
</body>
</html>
