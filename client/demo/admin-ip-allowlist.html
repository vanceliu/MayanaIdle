<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>同 IP 放行名單 — MayanaIdle</title>
<!--
  管理介面「帳號管理」分頁的同 IP 放行名單（`97-selfhosted-server.md` § 97.5「同 IP 同時在場」、§ 97.8）。
  樣式照 `server/src/adminPage.ts`，資料為假資料，新增／移除只改記憶體。

  用 Vite dev server 開：`npm run dev` 後開
  http://localhost:5173/MayanaIdle/demo/admin-ip-allowlist.html
-->
<style>
:root {
  --bg-deepest: #08081C;
  --bg-panel: #0E0E2F;
  --bg-card: #161648;
  --bg-inset: #05051D;
  --accent-primary: #A586FF;
  --accent-danger: #FF3457;
  --accent-success: #0ADD58;
  --accent-gold: #FFA101;
  --text-primary: #E2E8F0;
  --text-secondary: #94A3B8;
  --text-dim: #8A99B5;
  --border-width: 1.75px;
  --outline-dark: #4A4585;
  --radius-sm: 5px;
  --radius-md: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg-deepest); color: var(--text-primary); font-family: 'Noto Sans TC', system-ui, sans-serif; font-size: 14px; line-height: 1.5; padding: 16px; }
h1 { font-size: 18px; margin-bottom: 4px; }
h2 { font-size: 15px; margin: 16px 0 6px; }
.sub { color: var(--text-dim); font-size: 12px; margin-bottom: 12px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.tab, button { padding: 5px 12px; border: var(--border-width) solid var(--outline-dark); border-radius: var(--radius-sm); background: var(--bg-card); color: var(--text-primary); font: inherit; font-size: 13px; cursor: pointer; }
.tab.active { background: color-mix(in srgb, var(--accent-primary) 42%, var(--bg-card)); border-color: var(--accent-primary); font-weight: 600; }
button.danger { border-color: var(--accent-danger); color: var(--accent-danger); background: transparent; }
.panel { background: var(--bg-panel); border: var(--border-width) solid var(--outline-dark); border-radius: var(--radius-md); padding: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #262665; vertical-align: middle; }
th { color: var(--text-secondary); font-weight: 500; }
input, select { background: var(--bg-inset); color: var(--text-primary); border: var(--border-width) solid var(--outline-dark); border-radius: var(--radius-sm); padding: 4px 8px; font: inherit; font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.msg { margin-top: 10px; padding: 6px 10px; border-left: 3px solid var(--accent-gold); color: var(--accent-gold); }
.hint { color: var(--text-dim); font-size: 12px; }
.pill { font-size: 12px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--outline-dark); color: var(--text-dim); }
.pill.on { color: var(--accent-success); border-color: var(--accent-success); }
</style>
</head>
<body>
<h1>瑪雅那 管理介面</h1>
<div class="sub">demo · docs/design/97-selfhosted-server.md § 97.8</div>
<div id="app"></div>
<script>
const users = [
  { id: 1, username: 'vance', characters: 3, online: true },
  { id: 2, username: 'mika', characters: 1, online: true },
  { id: 3, username: 'roy', characters: 2, online: false },
];
const allowlist = [
  { ip: '203.0.113.24', note: '宿舍，3 人共用', addedAt: Date.now() - 3 * 86400000 },
];
let msg = '';

function esc(v) { return String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function date(t) { return new Date(t).toLocaleString('zh-TW', { hour12: false }); }

function render() {
  const tabs = ['狀態總覽', '玩家管理', '帳號管理', '角色查詢', '信箱補償', '備份', '設定'].map(t =>
    '<button class="tab' + (t === '帳號管理' ? ' active' : '') + '">' + t + '</button>').join('') + '<button>登出</button>';
  document.getElementById('app').innerHTML = '<div class="tabs">' + tabs + '</div><div class="panel">' +
    '<div class="hint">這裡管的是玩家的遊戲帳號。管理介面自己的帳號密碼在 server.properties。</div>' +
    '<div class="row"><span>註冊開關</span><select><option>open</option><option>invite</option><option>closed</option></select>' +
    '<button>儲存</button><span class="hint">與設定頁的 registration 是同一個鍵</span></div>' +

    '<h2>同 IP 放行名單</h2>' +
    '<div class="hint" style="margin-bottom:6px">同一 IP 同時在遊戲中最多 2 個帳號；名單上的 IP 不受限。IP 寫法同玩家管理的「來源」欄。</div>' +
    '<div class="row"><input id="ip" placeholder="IP（例：203.0.113.24）"><input id="note" placeholder="備註"><button onclick="doAdd()">新增</button></div>' +
    (allowlist.length
      ? '<table><tr><th>IP</th><th>備註</th><th>加入時間</th><th></th></tr>' +
        allowlist.map((a, i) => '<tr><td>' + esc(a.ip) + '</td><td>' + esc(a.note || '-') + '</td><td>' + date(a.addedAt) + '</td>' +
          '<td><button class="danger" onclick="doRemove(' + i + ')">移除</button></td></tr>').join('') + '</table>'
      : '<div class="hint">名單是空的</div>') +

    '<h2>帳號</h2>' +
    '<table><tr><th>ID</th><th>帳號</th><th>角色數</th><th>狀態</th><th></th></tr>' +
    users.map(u => '<tr><td>' + u.id + '</td><td>' + esc(u.username) + '</td><td>' + u.characters + '</td>' +
      '<td>' + (u.online ? '<span class="pill on">在線</span>' : '') + '</td>' +
      '<td><button>發救援碼</button> <button class="danger">封鎖</button></td></tr>').join('') + '</table>' +
    '</div>' + (msg ? '<div class="msg">' + esc(msg) + '</div>' : '');
}

window.doAdd = () => {
  const ip = document.getElementById('ip').value.trim();
  const note = document.getElementById('note').value.trim();
  if (!ip) return;
  const existing = allowlist.find(a => a.ip === ip);
  if (existing) existing.note = note;
  else allowlist.push({ ip, note, addedAt: Date.now() });
  msg = existing ? '已更新 ' + ip + ' 的備註' : '已放行 ' + ip;
  render();
};
window.doRemove = (i) => {
  const [a] = allowlist.splice(i, 1);
  msg = '已移除 ' + a.ip + '（已在遊戲中的帳號不踢除）';
  render();
};

render();
</script>
</body>
</html>
