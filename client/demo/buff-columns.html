<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuffBar 兩欄 Demo — MayanaIdle</title>
<!--
  BuffBar 兩欄排列（`24-buff-debuff.md` § 24.8.1／§ 24.8.2）。
  圖示樣式來自 App.css 的 `.buff-icon`／`.buff-timer`／`.buff-overflow`。

  用 Vite dev server 開：`npm run dev` 後開
  http://localhost:5173/MayanaIdle/demo/buff-columns.html

  .demo-* 是這頁的排版。
-->
<link rel="stylesheet" href="../src/App.css">
<style>
/* ═══════════ 這頁專用的排版 ═══════════ */
body {
  margin: 0; padding: 24px;
  background: var(--bg-deepest); color: var(--text-primary); font-family: var(--font-body);
}
.demo-title { font-family: var(--font-display); color: var(--accent-primary); margin: 0 0 4px; }
.demo-note { color: var(--text-dim); font-size: var(--fs-sm); margin: 0 0 16px; line-height: 1.8; }
.demo-controls {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 8px 32px;
  background: var(--bg-panel); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 20px; font-size: var(--fs-sm);
}
.demo-controls h3 {
  grid-column: 1 / -1; margin: 6px 0 0; font-size: var(--fs-sm); color: var(--accent-gold);
}
.demo-controls label { display: flex; align-items: center; gap: 8px; }
.demo-controls label span { flex: none; width: 120px; color: var(--text-secondary); }
.demo-controls input[type=range] { flex: 1; min-width: 0; }
.demo-controls output { flex: none; width: 40px; text-align: right; font-family: var(--font-mono); }
.demo-controls button {
  padding: 6px 14px; background: var(--bg-card); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer;
}
.demo-export { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; }
.demo-export pre { margin: 0; font-size: var(--fs-xs); color: var(--text-dim); }

.demo-frames { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.demo-frame-wrap h2 { font-family: var(--font-display); font-size: var(--fs-md); color: var(--accent-gold); margin: 0 0 8px; }

/* 假地圖：紫色地板＋深色底，對齊遊戲截圖 */
.demo-frame {
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, #2a2747 0 30%, #7b1fe8 30% 70%, #2a2747 70%);
  border: 1px solid var(--border); border-radius: var(--radius-md);
}
.demo-status {
  position: absolute; top: 6px; left: 8px;
  background: rgba(18, 18, 43, 0.85); border: 1px solid var(--accent-primary);
  border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
  color: var(--text-dim); font-size: var(--fs-sm);
}
.demo-selector {
  position: absolute; top: 6px; right: 8px; height: 36px;
  background: rgba(18, 18, 43, 0.85); border: 1px solid var(--accent-primary);
  border-radius: var(--radius-md); display: flex; align-items: center; padding: 0 10px;
  color: var(--text-dim); font-size: var(--fs-sm);
}
.demo-log {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: rgba(18, 18, 43, 0.92); border-top: 1px solid var(--accent-primary);
  color: var(--text-dim); font-size: var(--fs-sm); padding: 8px 10px;
}
.demo-bar-pos { position: absolute; left: 8px; }

/* 兩欄：直向填滿一欄再換欄 */
.demo-buff-grid {
  display: grid; grid-auto-flow: column; justify-content: start; align-items: start;
  pointer-events: none;
}
.demo-buff-grid .buff-overflow { align-self: center; justify-self: center; }
</style>
</head>
<body>
  <h1 class="demo-title">BuffBar 兩欄</h1>
  <p class="demo-note">
    回鍋加倍 → buff → debuff 依序往下排，碰到戰鬥紀錄上緣就換第二欄（戰鬥紀錄拖走時以下方快捷列為界）。兩欄都滿時，最後一格改成「+N」。<br>
    手機框的戰鬥紀錄位置對齊截圖（狀態卡下緣約 150px、戰鬥紀錄上緣約 607px）。
  </p>
  <div id="root"></div>
  <script type="module" src="./buffColumnsDemo.tsx"></script>
</body>
</html>
