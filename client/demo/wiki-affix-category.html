<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki 詞綴頁（分類）Demo — MayanaIdle</title>
<!--
  Wiki 詞綴頁依分類改版（`07-affix.md` § 7.3~§ 7.6、`43-wiki-system.md` § 4.2.1）。
  資料為 demo 內寫死的 § 7.6 詞綴池，model 尚未改版。

  用 Vite dev server 開：`npm run dev` 後開
  http://localhost:5173/MayanaIdle/demo/wiki-affix-category.html

  .demo-* 與 .cat-* 只是這頁的排版；其餘樣式來自 App.css 與 WikiTable.css。
-->
<link rel="stylesheet" href="../src/App.css">
<link rel="stylesheet" href="../src/wiki/components/WikiTable.css">
<style>
body {
  margin: 0; padding: 24px 16px;
  background: var(--bg-deepest); color: var(--text-primary); font-family: var(--font-body);
}
.demo-wrap { max-width: 960px; margin: 0 auto; }
.demo-title { font-family: var(--font-display); color: var(--accent-primary); margin: 0 0 4px; }
.demo-note { color: var(--text-dim); font-size: var(--fs-sm); margin: 0 0 20px; line-height: 1.8; }
.demo-h3 { color: var(--accent-gold); font-family: var(--font-display); margin: 28px 0 12px; }
.demo-h4 { color: var(--text-primary); font-size: var(--fs-sm); margin: 18px 0 6px; }
.demo-p { color: var(--text-secondary); font-size: var(--fs-sm); line-height: 1.7; margin: 10px 0 0; }

.cat-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.cat-chip {
  padding: 6px 12px; background: var(--bg-card); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: var(--fs-sm);
}
.cat-chip b { color: var(--text-primary); margin-right: 4px; }
.cat-chip.active { background: var(--bg-panel); border-color: var(--accent-gold); color: var(--accent-gold); }
.cat-chip.active b { color: var(--accent-gold); }

.cat-head {
  background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
  padding: 12px 14px; margin-bottom: 8px;
}
.cat-head h4 { margin: 0 0 6px; font-family: var(--font-display); color: var(--accent-gold); font-size: var(--fs-md); }
.cat-facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: var(--fs-sm); color: var(--text-secondary); }
.cat-facts strong { color: var(--text-primary); }
.cat-toolbar { display: flex; justify-content: flex-end; margin: 6px 0 -4px; }
.cat-toolbar button {
  padding: 4px 10px; background: var(--bg-card); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-size: var(--fs-xs);
}
.cat-shared { margin-left: 6px; font-size: var(--fs-xs); color: var(--text-dim); border: 1px solid var(--border-subtle); border-radius: 3px; padding: 0 4px; }
.cat-row { cursor: pointer; }
.cat-row td:first-child::before { content: '▸'; color: var(--text-dim); margin-right: 6px; }
.cat-row.open td:first-child::before { content: '▾'; }
.cat-tiers { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 0 4px; }
.cat-tiers .affix-tag { font-size: var(--fs-xs); }
.cat-matrix td, .cat-matrix th { text-align: center; white-space: nowrap; }
.cat-matrix td:first-child, .cat-matrix th:first-child { text-align: left; }
.cat-matrix th.clickable { cursor: pointer; text-decoration: underline dotted; }
.cat-dim { color: var(--text-dim); }
</style>
</head>
<body>
  <div class="demo-wrap">
    <h1 class="demo-title">Wiki 詞綴頁：依分類</h1>
    <p class="demo-note">
      〈詞綴一覽〉改成依分類切換：選一個部位，列出該部位能抽到的一般詞綴、免疫詞綴、T7 獨有詞綴與隨機技能。<br>
      點詞綴列展開 T1~T7 各階數值；「總覽」看全部分類的對照矩陣，點欄位標題跳到該分類。
    </p>
    <div id="root"></div>
  </div>
  <script type="module" src="./wikiAffixCategoryDemo.tsx"></script>
</body>
</html>
