<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 地圖素材 Demo — MayanaIdle</title>
<!--
  AI 地圖素材預覽（`docs/design/38-map-control.md` § 38.9「素材來源」）。
  素材：`node scripts/comfy/genTiles.mjs <theme>` 產到 `assets-src/`。

  用 Vite dev server 開：`npm run dev` 後開
  http://localhost:5173/MayanaIdle/demo/ai-tiles.html
-->
<link rel="stylesheet" href="../src/App.css">
<style>
body {
  margin: 0; padding: 24px;
  background: var(--bg-deepest); color: var(--text-primary); font-family: var(--font-body);
}
.demo-title { font-family: var(--font-display); color: var(--accent-primary); margin: 0 0 4px; }
.demo-note { color: var(--text-dim); font-size: var(--fs-sm); margin: 0 0 16px; line-height: 1.8; }
.demo-bar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; font-size: var(--fs-sm); }
.demo-maps { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.demo-pane { background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 10px; max-width: 100%; overflow: auto; }
.demo-pane h2, .demo-card h2 { font-family: var(--font-display); font-size: var(--fs-md); color: var(--accent-gold); margin: 0 0 8px; }
#ai { display: block; }
#gen2 { display: block; }
.demo-card { background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 14px; margin-top: 16px; }
.demo-gallery { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
.demo-gallery figure { margin: 0; text-align: center; font-size: var(--fs-xs); color: var(--text-dim); }
.demo-gallery img { display: block; margin: 0 auto 4px; background: #555; }
</style>
</head>
<body>
<h1 class="demo-title">AI 地圖素材（14 主題）</h1>
<p class="demo-note">
  ComfyUI <code>z_image_turbo</code> 產出，本機後處理成無縫地板材質與約一格寬的物件；素材密度為世界像素的 2 倍，平滑繪製。<br>
  地板整張烘焙：水／岩漿／深淵依周圍同類格覆蓋率＋雜訊分層出本體／淺層／岸線／岸邊，沙地以雜訊邊界融入、地毯整格鋪，判定仍為整格；草叢格散放直立小草。<br>
  邊界與牆為有材質的立體塊；岩石在人造主題或貼牆處為斷壁，成對石柱為倒柱，裝飾為堆放雜物。
</p>
<div class="demo-bar">
  <button id="prev" type="button">上一張</button>
  <label>地圖 <select id="mapId"></select></label>
  <button id="next" type="button">下一張</button>
  <label>縮放 <select id="zoom"><option value="1">×1</option><option value="2" selected>×2</option><option value="3">×3</option></select></label>
  <label><input id="showGen2" type="checkbox">並排第二代</label>
</div>
<div class="demo-maps">
  <div class="demo-pane"><h2>AI 素材</h2><canvas id="ai"></canvas></div>
  <div class="demo-pane" id="gen2-pane" hidden><h2>第二代（現行）</h2><canvas id="gen2" width="900" height="600"></canvas></div>
</div>
<div class="demo-card">
  <h2 id="gallery-title">素材一覽（原尺寸，密度 ×2）</h2>
  <div class="demo-gallery" id="gallery"></div>
</div>
<script type="module">
import { AI_THEMES, listMaps, renderMap, themeAssetUrls } from './aiTilesDemo.ts';
import { MapOutlineStage } from './mapOutlineDemo.ts';

const mapSelect = document.getElementById('mapId');
const zoomSelect = document.getElementById('zoom');
const showGen2 = document.getElementById('showGen2');
const aiCanvas = document.getElementById('ai');
const gen2Canvas = document.getElementById('gen2');
showGen2.checked = location.hash.includes('gen2');

const maps = await listMaps(AI_THEMES);
for (const map of maps) mapSelect.add(new Option(`${map.theme}／${map.id}（${map.width}×${map.height}）`, map.id));
const initial = location.hash.match(/map=([\w-]+)/)?.[1];
mapSelect.value = maps.some(m => m.id === initial) ? initial : maps[0]?.id;

let gen2 = null;
async function render() {
  const map = maps.find(m => m.id === mapSelect.value);
  if (!map) return;
  const zoom = Number(zoomSelect.value);
  history.replaceState(null, '', `#map=${map.id}${showGen2.checked ? '&gen2' : ''}`);
  renderGallery(map.theme);
  await renderMap(aiCanvas, map, zoom);
  document.getElementById('gen2-pane').hidden = !showGen2.checked;
  if (!showGen2.checked) return;
  gen2Canvas.width = aiCanvas.clientWidth;
  gen2Canvas.height = aiCanvas.clientHeight;
  if (!gen2) {
    gen2 = new MapOutlineStage();
    await gen2.init(gen2Canvas, gen2Canvas.width, gen2Canvas.height);
    gen2.params.showActors = false;
  }
  gen2.setMap(map);
  gen2.layout(gen2Canvas.width, gen2Canvas.height, zoom);
}

const gallery = document.getElementById('gallery');
let galleryTheme = null;
function renderGallery(theme) {
  if (theme === galleryTheme) return;
  galleryTheme = theme;
  document.getElementById('gallery-title').textContent = `素材一覽：${theme}（原尺寸，密度 ×2）`;
  gallery.replaceChildren();
  for (const { name, url } of themeAssetUrls(theme)) {
    const fig = document.createElement('figure');
    const img = new Image();
    img.src = url;
    fig.append(img, name.slice(theme.length + 1));
    gallery.append(fig);
  }
}

function step(delta) {
  const index = maps.findIndex(m => m.id === mapSelect.value);
  mapSelect.value = maps[(index + delta + maps.length) % maps.length].id;
  render();
}
document.getElementById('prev').addEventListener('click', () => step(-1));
document.getElementById('next').addEventListener('click', () => step(1));

mapSelect.addEventListener('change', render);
zoomSelect.addEventListener('change', render);
showGen2.addEventListener('change', render);
await render();
</script>
</body>
</html>
