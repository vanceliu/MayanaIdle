<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鐵匠鋪取用倉庫 Demo — MayanaIdle</title>
<!--
  鐵匠鋪製作取用倉庫（`06-equipment-acquire.md` § 6A.3「取用來源」）：配方卡片的素材來源與前置裝備指定。
  版面樣本：class 與 App.css 相同，判定走遊戲的 `evaluateCraftRequirements`，資料取自 seed。

  用 Vite dev server 開：`npm run dev` 後開
  http://localhost:5173/MayanaIdle/demo/craft-warehouse.html
-->
<link rel="stylesheet" href="../src/App.css">
<style>
body {
  margin: 0; padding: 24px;
  background: var(--bg-deepest); color: var(--text-primary); font-family: var(--font-body);
}
.demo-title { font-family: var(--font-display); color: var(--accent-primary); margin: 0 0 4px; }
.demo-note { color: var(--text-dim); font-size: var(--fs-sm); margin: 0 0 16px; line-height: 1.8; }
.demo-bar { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; margin-bottom: 16px; font-size: var(--fs-sm); }
.demo-bar fieldset { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 10px; margin: 0; }
.demo-bar legend { color: var(--accent-gold); padding: 0 4px; }
.demo-bar label { margin-right: 10px; cursor: pointer; }
.demo-grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.demo-card {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 12px;
}
.demo-card h2 { font-family: var(--font-display); font-size: var(--fs-md); color: var(--accent-gold); margin: 0 0 8px; }
.demo-blacksmith { width: 640px; max-width: 100%; }
.demo-tracker { width: 300px; max-width: 100%; }
.demo-stock { font-size: var(--fs-sm); color: var(--text-secondary); line-height: 1.8; }

/* 以下為新增樣式，定案後搬進 App.css */
.bs-craft-mat-src { color: var(--text-dim); font-size: var(--fs-xs); }
.bs-mat-source-tooltip { font-size: var(--fs-sm); line-height: 1.7; white-space: nowrap; }
.bs-prereq-open { padding: 1px 8px; font-size: var(--fs-xs); }
.bs-source-tag-inline { font-size: var(--fs-xs); color: var(--accent-primary); }
.modal-content.bs-prereq-modal { height: auto; max-height: calc(60 * var(--vh-unit, 1vh)); width: 420px; }
.bs-prereq-list { display: flex; flex-direction: column; gap: 2px; font-size: var(--fs-sm); }
.bs-prereq-option {
  display: flex; align-items: center; gap: 6px; padding: 2px 6px; cursor: pointer;
  border: var(--border-width) solid transparent; border-radius: var(--radius-sm);
}
.bs-prereq-option:hover { background: var(--bg-deepest); }
.bs-prereq-option.selected { border-color: var(--accent-primary); background: var(--bg-deepest); }
.bs-prereq-radio { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--text-dim); flex: none; }
.bs-prereq-option.selected .bs-prereq-radio { background: var(--accent-primary); border-color: var(--accent-primary); }
.bs-prereq-meta { color: var(--text-dim); font-size: var(--fs-xs); }
.bs-source-tag { margin-left: auto; font-size: var(--fs-xs); color: var(--accent-primary); }
</style>
</head>
<body>
  <h1 class="demo-title">鐵匠鋪取用倉庫</h1>
  <p class="demo-note">
    素材與前置裝備取自背包＋個人倉庫＋帳號倉庫（公會倉庫不算），素材依背包 → 個人 → 帳號扣。<br>
    前置裝備由玩家指定，未指定時製作鈕停用（同隨機技能）。按「選擇」開視窗，列出三處所有符合的實例，可捲動；名稱 hover 看完整裝備，點一列即選定。<br>
    切換情境看足／不足（「前置很多件」看捲動）；素材來源有兩種顯示方式可比較。任務追蹤只顯示合計。
  </p>
  <div id="root"></div>
  <script type="module" src="./craftWarehouseDemo.tsx"></script>
</body>
</html>
