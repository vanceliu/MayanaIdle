<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>怪物底圖 — MayanaIdle</title>
<!--
  怪物 img2img 底圖（`docs/design/25-monster-system.md` § 25.2.2）。
  下載後放到 `client/assets-src/monster-bases/<key>.png`，再跑 `node scripts/comfy/genMonsters.mjs --only <key>`。

  用 Vite dev server 開：`npm run dev` 後開
  http://localhost:5173/MayanaIdle/demo/monster-base.html
-->
<link rel="stylesheet" href="../src/App.css">
<style>
body {
  margin: 0; padding: 24px;
  background: var(--bg-deepest); color: var(--text-primary); font-family: var(--font-body);
}
.demo-title { font-family: var(--font-display); color: var(--accent-primary); margin: 0 0 4px; }
.demo-note { color: var(--text-dim); font-size: var(--fs-sm); margin: 0 0 16px; line-height: 1.8; }
.demo-card {
  background: var(--bg-panel); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md); padding: 14px; margin-bottom: 16px; font-size: var(--fs-sm);
}
.demo-card h2 { font-family: var(--font-display); font-size: var(--fs-md); color: var(--accent-gold); margin: 0 0 10px; }
.demo-card canvas { display: block; width: 100%; max-width: 768px; height: auto; margin-bottom: 8px; }
</style>
</head>
<body>
<h1 class="demo-title">怪物底圖</h1>
<p class="demo-note">
  正面／側面（朝右）／背面的剪影：人形為角色剪影（與玩家角色同一套畫法與比例），Wyvern 為無手、翅膀收在兩側的剪影；配色取自產圖清單的 <code>base</code>。<br>
  下載後放到 <code>client/assets-src/monster-bases/</code>，檔名不改。
</p>
<div id="list"></div>
<script type="module">
import { renderPawnBases } from './monsterBaseDemo.ts';
const list = document.getElementById('list');
for (const { key, name, canvas } of renderPawnBases()) {
  const card = document.createElement('div');
  card.className = 'demo-card';
  const title = document.createElement('h2');
  title.textContent = name;
  const link = document.createElement('a');
  link.href = canvas.toDataURL('image/png');
  link.download = `${key}.png`;
  link.textContent = `下載 ${key}.png`;
  card.append(title, canvas, link);
  list.append(card);
}
</script>
</body>
</html>
