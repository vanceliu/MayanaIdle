<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>瑪雅那 Idle</title>
<style>
  :root {
    --bg: #0b1020;
    --card: #161b33;
    --card-hi: #1e2547;
    --line: #2c3358;
    --text: #e6e9f5;
    --dim: #97a0c4;
    --accent: #a586ff;
    --danger: #ff5f7a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 48px 32px;
    background: radial-gradient(120% 120% at 50% 0%, #1a2145 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  h1 { margin: 0; font-size: 30px; letter-spacing: 2px; }
  .version { color: var(--dim); font-size: 13px; margin-top: -20px; }
  .modes { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .mode {
    width: 260px;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    text-align: left;
    color: var(--text);
    cursor: pointer;
    font: inherit;
    transition: background .12s, border-color .12s;
  }
  .mode:hover:not(:disabled) { background: var(--card-hi); border-color: var(--accent); }
  .mode:disabled { opacity: .5; cursor: default; }
  .mode-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .mode-desc { color: var(--dim); font-size: 13px; line-height: 1.5; }
  .panel {
    width: 100%;
    max-width: 820px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
  }
  .panel h2 { margin: 0 0 12px; font-size: 15px; color: var(--dim); font-weight: 600; }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1;
    padding: 10px 12px;
    background: #0f1430;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button.go {
    padding: 10px 20px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #12112b;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.go:disabled { opacity: .5; cursor: default; }
  ul { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: #0f1430;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  li .name { font-weight: 600; }
  li .addr { color: var(--dim); font-size: 13px; }
  li .spacer { flex: 1; }
  li button {
    padding: 4px 10px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--dim);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  li button:hover { color: var(--text); border-color: var(--accent); }
  li button.remove:hover { color: var(--danger); border-color: var(--danger); }
  .empty { color: var(--dim); font-size: 13px; margin-top: 12px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; }
  .panel-head h2 { margin: 0; }
  .panel-actions { margin-top: 14px; display: flex; justify-content: flex-end; }
  .link { background: none; border: none; color: var(--dim); font: inherit; cursor: pointer; }
  .link:hover { color: var(--text); }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.6; margin: 4px 0 14px; }
  code { background: #0f1430; padding: 1px 5px; border-radius: 4px; }
  .form { display: grid; grid-template-columns: 200px 1fr; gap: 8px 12px; align-items: center; max-height: 46vh; overflow-y: auto; padding-right: 6px; }
  .form label { color: var(--dim); font-size: 13px; }
  .form label .key { color: var(--text); font-weight: 600; }
  .world-port { color: var(--dim); font-size: 13px; }
  .world-warn { color: var(--danger); font-size: 12px; }
  .mode-config { display: inline-block; margin-top: 10px; font-size: 12px; }
  .mode-config:hover { text-decoration: underline; }
  .message { min-height: 20px; color: var(--danger); font-size: 13px; }
  .busy { color: var(--dim); }
</style>
</head>
<body>
  <h1>瑪雅那 Idle</h1>
  <div class="version" id="version"></div>


  <div class="modes" id="home-modes">
    <button class="mode" id="solo">
      <div class="mode-title">單機開始</div>
      <div class="mode-desc">只有自己，資料存在這台電腦。不開放連線。</div>
      <span class="link mode-config" id="solo-config">設定</span>
    </button>
    <button class="mode" id="open">
      <div class="mode-title">開放（開站）</div>
      <div class="mode-desc">在這台電腦開一台 server，同網路的人可以連進來。</div>
    </button>
  </div>

  <!-- 開放：先選已建立的世界，或走建立流程；不會偷偷用預設值建一個 -->
  <div class="panel" id="open-view" hidden>
    <div class="panel-head">
      <h2>開放（開站）</h2>
      <button class="link" id="open-back">← 返回</button>
    </div>
    <ul id="worlds"></ul>
    <div class="empty" id="worlds-empty" hidden>還沒有建立任何 server</div>
    <div class="panel-actions">
      <button class="go" id="world-new">建立新的 server</button>
    </div>
  </div>

  <div class="panel" id="create-view" hidden>
    <div class="panel-head">
      <h2 id="create-title">建立新的 server</h2>
      <button class="link" id="create-back">← 返回</button>
    </div>
    <p class="hint" id="create-hint"></p>
    <div class="form" id="create-form"></div>
    <div class="message" id="create-message"></div>
    <div class="panel-actions">
      <button class="link" id="create-folder" hidden>打開資料夾</button>
      <button class="go" id="create-submit">建立並啟動</button>
    </div>
  </div>

  <div class="panel" id="connect-view">
    <h2>連線到別人的 server</h2>
    <div class="row">
      <input id="address" placeholder="192.168.1.10:25580 或直接貼網址" autocomplete="off" />
      <button class="go" id="connect">連線</button>
    </div>
    <div class="message" id="message"></div>
    <ul id="recent"></ul>
    <div class="empty" id="empty" hidden>還沒有連過任何 server</div>
  </div>

<script>
  const api = window.launcher;
  const $ = id => document.getElementById(id);
  const message = $('message');

  function setBusy(text) {
    message.className = text ? 'message busy' : 'message';
    message.textContent = text ?? '';
  }

  function fail(text) {
    message.className = 'message';
    message.replaceChildren(document.createTextNode(text));
    setButtons(false);
  }

  /** 起不來多半是埠或位址要改，直接把設定表單端出來 */
  function offerDataDir(kind, id) {
    const edit = document.createElement('button');
    edit.textContent = '編輯設定';
    edit.style.cssText = 'margin-left:8px;padding:2px 8px;font:inherit;font-size:12px;background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--dim);cursor:pointer';
    edit.onclick = () => void openEditForm(kind, id);
    message.append(edit);
  }

  function setButtons(disabled) {
    for (const id of ['solo', 'open', 'connect']) $(id).disabled = disabled;
  }

  async function renderRecent() {
    const list = await api.listServers();
    const ul = $('recent');
    ul.replaceChildren();
    $('empty').hidden = list.length > 0;

    for (const entry of list) {
      const li = document.createElement('li');
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = entry.name;
      const addr = document.createElement('span');
      addr.className = 'addr';
      addr.textContent = `${entry.host}:${entry.port}`;
      const spacer = document.createElement('span');
      spacer.className = 'spacer';

      const go = document.createElement('button');
      go.textContent = '連線';
      go.onclick = () => connect(`${entry.host}:${entry.port}`);

      const rename = document.createElement('button');
      rename.textContent = '改名';
      rename.onclick = async () => {
        const next = prompt('這台 server 的名稱', entry.name);
        if (next === null) return;
        await api.renameServer({ host: entry.host, port: entry.port }, next);
        void renderRecent();
      };

      const remove = document.createElement('button');
      remove.className = 'remove';
      remove.textContent = '移除';
      remove.onclick = async () => {
        await api.forgetServer({ host: entry.host, port: entry.port });
        void renderRecent();
      };

      li.append(name, addr, spacer, go, rename, remove);
      ul.append(li);
    }
  }

  function show(view) {
    for (const id of ['home-modes', 'connect-view', 'open-view', 'create-view']) {
      $(id).hidden = id !== view && !(view === 'home' && (id === 'home-modes' || id === 'connect-view'));
    }
  }

  async function start(kind, id) {
    setButtons(true);
    setBusy(kind === 'solo' ? '正在開啟單機世界…' : '正在啟動 server…');
    const result = await api.startWorld(kind, id);
    if (!result.ok) {
      fail(result.message);
      if (result.dataDir) offerDataDir(kind, id);
    }
  }

  /** 開放世界清單：每一個都是一個資料目錄，各自的設定寫在自己的 server.properties */
  async function renderWorlds() {
    const worlds = await api.listWorlds();
    const ul = $('worlds');
    ul.replaceChildren();
    $('worlds-empty').hidden = worlds.length > 0;

    for (const world of worlds) {
      const li = document.createElement('li');
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = world.name;
      const meta = document.createElement('span');
      meta.className = 'world-port';
      meta.textContent = `埠 ${world.port}・註冊 ${world.registration}`;
      const spacer = document.createElement('span');
      spacer.className = 'spacer';

      const go = document.createElement('button');
      go.textContent = '啟動';
      go.onclick = () => void start('open', world.id);

      const settings = document.createElement('button');
      settings.textContent = '設定';
      settings.onclick = () => void openEditForm('open', world.id);

      const remove = document.createElement('button');
      remove.className = 'remove';
      remove.textContent = '刪除';
      remove.onclick = async () => {
        const result = await api.deleteWorld(world.id);
        if (result.ok) void renderWorlds();
        else if (result.message) fail(result.message);
      };

      li.append(name, meta);
      if (!world.hasAdminPassword) {
        const warn = document.createElement('span');
        warn.className = 'world-warn';
        warn.textContent = '未設管理密碼';
        li.append(warn);
      }
      li.append(spacer, go, settings, remove);
      ul.append(li);
    }
  }

  /*
   * 設定表單：建立與編輯共用同一張。欄位（鍵、預設值）來自 server 的設定規格，
   * 頁面只負責畫出來與收值 —— 鍵清單不在這裡重寫一份。
   */
  let formMode = { kind: 'open', id: null, create: true };

  function renderFields(fields, name) {
    const form = $('create-form');
    form.replaceChildren();
    $('create-message').textContent = '';

    const nameLabel = document.createElement('label');
    nameLabel.innerHTML = '<span class="key">server 名稱</span>';
    const nameInput = document.createElement('input');
    nameInput.id = 'create-name';
    nameInput.placeholder = '玩家看到的名稱';
    nameInput.value = name ?? '';
    form.append(nameLabel, nameInput);

    for (const field of fields) {
      if (field.key === 'server-name') continue;
      const label = document.createElement('label');
      label.innerHTML = `<span class="key">${field.key}</span>` + (field.timing === 'restart' ? '<br>改了要重啟' : '');
      const input = document.createElement('input');
      input.dataset.key = field.key;
      input.value = field.value;
      form.append(label, input);
    }
  }

  async function openCreateForm() {
    formMode = { kind: 'open', id: null, create: true };
    $('create-title').textContent = '建立新的 server';
    $('create-submit').textContent = '建立並啟動';
    $('create-folder').hidden = true;
    $('create-hint').innerHTML = '全部設定都會寫進這個世界的 <code>server.properties</code>。'
      + '<code>bind</code> 固定為 <code>0.0.0.0</code>：形態一經建立即固定，不能事後改成單機。';
    show('create-view');
    renderFields(await api.worldFields(), '');
  }

  async function openEditForm(kind, id) {
    formMode = { kind, id, create: false };
    const config = await api.worldConfig(kind, id);
    $('create-title').textContent = kind === 'solo' ? '單機世界設定' : `設定：${config.name}`;
    $('create-submit').textContent = '儲存並啟動';
    $('create-folder').hidden = false;
    $('create-hint').innerHTML = `寫入 <code>${config.dir}/server.properties</code>。`
      + '標「改了要重啟」的鍵下次啟動才生效；<code>bind</code> 不可更改（形態一經建立即固定）。';
    show('create-view');
    renderFields(config.fields, config.name);
  }

  async function submitForm() {
    const name = $('create-name').value.trim();
    const values = {};
    for (const input of $('create-form').querySelectorAll('input[data-key]')) values[input.dataset.key] = input.value.trim();
    $('create-message').textContent = '';

    if (formMode.create) {
      const result = await api.createWorld(name, values);
      if (!result.ok) return void ($('create-message').textContent = result.message);
      return void start('open', result.id);
    }

    const saved = await api.saveWorldConfig(formMode.kind, formMode.id, name, values);
    if (!saved.ok) return void ($('create-message').textContent = saved.message);
    await start(formMode.kind, formMode.id);
  }

  $('solo').onclick = () => void start('solo');
  $('open').onclick = async () => { show('open-view'); await renderWorlds(); };
  $('open-back').onclick = () => show('home');
  $('world-new').onclick = () => void openCreateForm();
  $('create-back').onclick = async () => {
    if (formMode.kind === 'solo') return show('home');
    show('open-view');
    await renderWorlds();
  };
  $('create-submit').onclick = () => void submitForm();
  $('create-folder').onclick = () => api.openDataDir(formMode.kind, formMode.id ?? undefined);
  $('solo-config').onclick = e => { e.stopPropagation(); void openEditForm('solo'); };
  $('connect').onclick = () => void connect();
  $('address').addEventListener('keydown', e => { if (e.key === 'Enter') void connect(); });

  api.appInfo().then(info => { $('version').textContent = `v${info.version}`; });
  void renderRecent();
</script>
</body>
</html>
