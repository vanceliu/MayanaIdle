# 型別與測試（docs/RELEASE.md § 3.1）：release-server.yml、release-desktop.yml 共用。
name: Test

on:
  workflow_call:
    inputs:
      tag-prefix:
        description: tag 去掉此前綴後須等於 client/package.json 的版本
        type: string
        default: ''

jobs:
  test:
    name: 型別與測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # 產物版本取自 client/package.json；允許 `-rc1` 這類預發布後綴，基底版本須相同
      - name: 核對 tag 與 client/package.json 版本
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          version=$(node -p "require('./client/package.json').version")
          tag="${GITHUB_REF_NAME#"$TAG_PREFIX"}"
          if [ "$tag" != "$version" ] && [ "${tag%%-*}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME 與 client/package.json 的 $version 不一致" >&2
            echo "（要試跑可以用 ${TAG_PREFIX}${version}-rc1 這種後綴）" >&2
            exit 1
          fi

      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: desktop
      # 根 tsconfig 是 references 形式，一律 tsc -b；server／desktop 的 typecheck 會先產生 src/generated/mapsIndex
      - run: npx tsc -b
        working-directory: client
      - run: npm run typecheck
        working-directory: server
      - run: npm run typecheck
        working-directory: desktop
      - run: npx vitest run
        working-directory: client
      - run: npm test
        working-directory: server
      - run: npm test
        working-directory: desktop
