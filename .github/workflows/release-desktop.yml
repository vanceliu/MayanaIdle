# 發布桌面版（docs/RELEASE.md § 3.1）：三平台桌面版，另附 macOS／Windows 的 server 執行檔。
# 每個平台由對應的 runner 原生打包；Release 獨立且不標 latest（latest 留給 release-server.yml）。
name: Release Desktop

on:
  push:
    # desktop- 加版本號，例如 desktop-0.9.1、desktop-0.9.1-rc1
    tags: ['desktop-[0-9]*']
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      tag-prefix: desktop-

  build:
    name: 打包 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS (arm64)
            desktop: --mac
          - os: ubuntu-latest
            label: Linux (x64)
            desktop: --linux
          - os: windows-latest
            label: Windows (x64)
            desktop: --win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: desktop

      # 前端要先有：server 執行檔與桌面版都把它包進去
      - run: npm run build
        working-directory: client
      - run: npm run build
        working-directory: server

      # Linux server 由 release-server.yml 發布
      - run: node scripts/package.mjs
        if: runner.os != 'Linux'
        working-directory: server

      - run: npm run package -- ${{ matrix.desktop }}
        working-directory: desktop
        env:
          OFFICIAL_SERVER_URL: ${{ vars.OFFICIAL_SERVER_URL }}

      # 收成一層平的：upload-artifact 會保留共同上層路徑
      - name: 收齊要發布的檔案
        shell: bash
        run: |
          mkdir -p dist-out
          shopt -s nullglob
          # macOS server 以 tar.gz 散布以保留執行權限位；Windows 裸 .exe
          export COPYFILE_DISABLE=1
          if [ -f server/release/mayana-server-macos-arm64 ]; then
            tar -czf dist-out/mayana-server-macos-arm64.tar.gz -C server/release mayana-server-macos-arm64
          fi
          for f in server/release/*.exe; do cp "$f" dist-out/; done
          # 桌面版只取可散布的，不要 blockmap、unpacked 目錄與 builder-debug.yml
          cp desktop/release/*.dmg desktop/release/*.zip desktop/release/*.tar.gz desktop/release/*.exe dist-out/
          ls -lh dist-out

      - uses: actions/upload-artifact@v4
        with:
          name: mayana-desktop-${{ matrix.os }}
          if-no-files-found: error
          path: dist-out/*

  release:
    name: 建立 Release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # 帶後綴的 tag 標 pre-release；同一個 tag 重跑時沿用既有 Release，附檔以 --clobber 覆蓋
      - run: |
          set -eu
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            prerelease=""
            case "$GITHUB_REF_NAME" in desktop-*-*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "desktop ${GITHUB_REF_NAME#desktop-}" \
              --generate-notes --latest=false $prerelease
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber artifacts/*/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
